<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upscaler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#fafafa] text-[#171717] antialiased">

    <div class="min-h-screen flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-[480px]">
            <header class="text-center mb-10">
                <h1 class="text-2xl font-semibold tracking-tight">Image Upscaler</h1>
                <p class="text-sm text-neutral-500 mt-2">Tingkatkan resolusi gambar dengan presisi tinggi.</p>
            </header>

            <main class="bg-white border border-neutral-200 rounded-2xl shadow-sm p-8">
                <div class="space-y-6">
                    <div id="dropZone" class="relative border-2 border-dashed border-neutral-200 rounded-xl p-8 text-center transition-all hover:border-neutral-300">
                        <input type="file" id="imageInput" accept="image/png, image/jpeg" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div id="previewContainer" class="hidden mb-4">
                            <img id="uploadPreview" src="" class="max-h-32 mx-auto rounded-lg shadow-sm">
                        </div>
                        <div id="uploadPlaceholder">
                            <p class="text-sm font-medium">Klik untuk unggah</p>
                            <p class="text-xs text-neutral-400 mt-1">PNG atau JPG up to 10MB</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[12px] uppercase tracking-wider font-bold text-neutral-400 mb-2">Resolusi</label>
                            <select id="scaleInput" class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-neutral-400 transition-all">
                                <option value="2">2x HD</option>
                                <option value="4">4x Ultra HD</option>
                                <option value="8">8x Max</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[12px] uppercase tracking-wider font-bold text-neutral-400 mb-2">Jenis</label>
                            <select id="animeToggle" class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-neutral-400 transition-all">
                                <option value="false">Fotografi</option>
                                <option value="true">Ilustrasi/Art</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="processImage()" id="btnSubmit" class="w-full bg-[#171717] text-white text-sm font-medium py-3 rounded-lg hover:bg-neutral-800 transition-all active:scale-[0.98] disabled:bg-neutral-200 disabled:text-neutral-400">
                        Proses Gambar
                    </button>
                </div>

                <div id="status" class="hidden mt-8">
                    <div class="flex flex-col items-center">
                        <div class="loading-bar mb-3"></div>
                        <p class="text-[13px] text-neutral-500">Menganalisis piksel...</p>
                    </div>
                </div>

                <div id="result" class="hidden mt-8 pt-8 border-t border-neutral-100">
                    <img id="outputImage" src="" class="w-full rounded-lg shadow-inner mb-4">
                    <a id="downloadBtn" href="#" download="result.png" class="flex items-center justify-center w-full bg-white border border-neutral-200 text-sm font-medium py-3 rounded-lg hover:bg-neutral-50 transition-all">
                        Simpan Gambar
                    </a>
                </div>
            </main>

            <footer class="mt-8 text-center">
                <p class="text-[12px] text-neutral-400">&copy; 2026 Upscaler Studio</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
